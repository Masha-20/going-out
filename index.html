<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matcha Date</title>
<style>
body {
font-family: sans-serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
margin: 0;
background: #e8f5e9;
text-align: center;
padding: 20px;
touch-action: manipulation;
}
.card {
background: #ffffff;
padding: 30px;
border-radius: 20px;
box-shadow: 0 4px 15px rgba(0,0,0,0.1);
max-width: 350px;
width: 90%;
border: 2px solid #a5d6a7;
}
h1 { color: #2e7d32; font-size: 24px; }
.buttons {
margin-top: 20px;
display: flex;
justify-content: center;
align-items: center;
gap: 20px;
min-height: 60px;
}
button {
padding: 12px 24px;
font-size: 18px;
border: none;
border-radius: 25px;
cursor: pointer;
font-weight: bold;
}
#yesBtn { background: #4caf50; color: white; }
#noBtn { background: #81c784; color: white; }
.note {
margin-top: 20px;
padding: 10px;
background: #f1f8e9;
border-radius: 10px;
color: #33691e;
font-weight: bold;
}
</style>
</head>
<body>
<div class="card" id="mainCard">
<h1 id="text">نروح نشرب ماتشا؟ 🍵✨</h1>
<div class="buttons">
<button id="yesBtn" onclick="accept()">أيوا</button>
<button id="noBtn" onclick="handleNo()" ontouchstart="handleNo()">لا</button>
</div>
</div>
<script>
var clickCount = 0;
function handleNo() {
clickCount++;
var textElem = document.getElementById('text');
var noBtn = document.getElementById('noBtn');
if (clickCount === 1) {
textElem.innerText = "بلييييز 🥺🍵";
} else if (clickCount === 2) {
textElem.innerText = "طيب ماتشا وحدة بس؟ 🥺💚";
} else {
textElem.innerText = "تكفين وحشتيني يلا نطلع 💔✨";
}
var x = Math.random() * (window.innerWidth - 120);
var y = Math.random() * (window.innerHeight - 60);
noBtn.style.position = 'fixed';
noBtn.style.left = x + 'px';
noBtn.style.top = y + 'px';
}
function accept() {
var card = document.getElementById('mainCard');
card.innerHTML = '<h1>متحمسة أشوفك! 🥳💚</h1><p>📍 المكان: (اكتبي المكان)</p><p>📅 التاريخ: (اكتبي التاريخ)</p><p>⏰ الوقت: (اكتبي الوقت)</p><div class="note">ترا الماتشا علي.. والسوالف عليك! 😉🍵</div>';
}
</script>
</body>
</html>
