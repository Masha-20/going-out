<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلعة ممتعة! ✨</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #ffe6e8;
      margin: 0;
      overflow: hidden;
    }
    h1 { color: #d63384; text-align: center; font-size: 28px; padding: 0 15px; }
    .buttons { margin-top: 30px; position: relative; width: 100%; display: flex; justify-content: center; }
    button {
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #yesBtn { background-color: #ff4757; color: white; margin-left: 15px; }
    #noBtn { background-color: #747d8c; color: white; position: absolute; }
  </style>
</head>
<body>

  <h1 id="text">تطلعين معي ونغير جو؟ 💖</h1>
  
  <div class="buttons">
    <button id="yesBtn" onclick="accept()">أكيد موافقة! ✨</button>
    <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">لا، مشغولة 💔</button>
  </div>

  <script>
    function moveButton() {
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 60);
      const noBtn = document.getElementById('noBtn');
      noBtn.style.left = ${x}px;
      noBtn.style.top = ${y}px;
      
      document.getElementById('text').innerText = "تكفين وافقي خلينا نطلع! 🥺💖";
    }

    function accept() {
      document.body.innerHTML = "<h1 style='color:#d63384; font-size: 32px;'>يا حليلك! تم الاتفاق 🎉🥳<br><br>حددي اليوم والوقت بسرعة! ✨</h1>";
    }
  </script>
</body>
</html>
